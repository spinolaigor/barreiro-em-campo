name: Validar localização em campo
on:
  push:
    branches: ['hotfix/localizacao-*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe
        run: |
          node --check ronda.js
          node --check localizacao-campo.js
      - name: Testar GPS, privacidade e preservação das rondas
        run: node --test tests/*.test.cjs
      - name: Confirmar conteúdo público
        run: |
          test -s index.html
          test -s localizacao-campo.css
          test -s localizacao-campo.js
          test -s micros.geojson
